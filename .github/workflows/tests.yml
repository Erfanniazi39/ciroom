# Functional and end-to-end tests (tests/functional, tests/e2e) on every push to main and by hand.
# Separate from release.yml on purpose: these never block a release. Tests marked { todo: "D-xx" } are known defects:
# they are reported but don't fail the run. Everything uses synthetic media made with ffmpeg; nothing goes online
# (TMDB/IMDb are mocked inside the test server).
name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg and mpv (test media is generated; the full-player tests run mpv without a window)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mpv
      - run: npm ci
      - run: npm run build
      - run: npm run test:functional

  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg and mpv (Google Chrome is already on the runner image)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mpv
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
