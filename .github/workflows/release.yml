# Builds CiRoom and publishes a signed release when a version tag (v1.2.3) is pushed (npm run release does that).
# The installed apps check this repository's latest release for updates (latest.json lists every platform).
# Needs two repository secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # One release first (with the notes from the tag message), so the builds below all add to the same one.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.txt
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "CiRoom ${GITHUB_REF_NAME}" --notes-file notes.txt

  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
      - name: Bundle Node (runs CiRoom's server)
        run: |
          mkdir -p src-tauri/binaries
          cp "$(command -v node)" src-tauri/binaries/node-x86_64-unknown-linux-gnu
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CiRoom ${{ github.ref_name }}
          releaseDraft: false
          includeUpdaterJson: true

  windows:
    needs: [release, linux] # after Linux, so the two never update latest.json at the same moment
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Bundle Node (runs CiRoom's server)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item (Get-Command node).Source src-tauri/binaries/node-x86_64-pc-windows-msvc.exe
      - name: Bundle mpv and ffmpeg (Windows has neither)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $gh = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "ciroom-build" }
          $bin = "src-tauri/windows-bin"
          New-Item -ItemType Directory -Force $bin, dl | Out-Null
          # ffmpeg + ffprobe: BtbN GPL shared build of the 8.1 release line (includes Chromaprint, used for skip intro)
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip -OutFile dl/ffmpeg.zip
          Expand-Archive dl/ffmpeg.zip dl/ffmpeg
          Get-ChildItem dl/ffmpeg -Recurse -Include ffmpeg.exe, ffprobe.exe, *.dll | Copy-Item -Destination $bin
          # mpv: shinchiro build (the newest x86_64 one; not the "v3" build, which needs a newer CPU)
          $rel = Invoke-RestMethod -Headers $gh https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $mp = $rel.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}-git-.*\.7z$' } | Select-Object -First 1
          if (-not $mp) { throw "mpv build not found in $($rel.tag_name): $($rel.assets.name -join ', ')" }
          Invoke-WebRequest $mp.browser_download_url -OutFile dl/mpv.7z
          7z x dl/mpv.7z -odl/mpv -y | Out-Null
          Get-ChildItem dl/mpv -Recurse -Include mpv.exe, *.dll | Copy-Item -Destination $bin
          # Checks: Chromaprint present, both programs run
          $mux = & "$bin/ffmpeg.exe" -hide_banner -muxers 2>&1 | Out-String
          if ($mux -notmatch "chromaprint") { throw "ffmpeg has no Chromaprint" }
          & "$bin/ffprobe.exe" -version | Select-Object -First 1
          & "$bin/mpv.exe" --version | Select-Object -First 1
          Get-ChildItem $bin | Format-Table Name, Length
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CiRoom ${{ github.ref_name }}
          releaseDraft: false
          includeUpdaterJson: true
