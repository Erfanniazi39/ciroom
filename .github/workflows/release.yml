# Builds CiRoom and publishes a signed release when a version tag (v1.2.3) is pushed (npm run release does that).
# Order: tests → draft release → builds (the Linux one is checked for its media plugins; Android runs next to Linux) → publish. A failure anywhere leaves
# the release a DRAFT, which the installed apps never see.
# The installed apps check this repository's latest release for updates (latest.json lists every platform).
# Needs two repository secrets for the desktop updater: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
# and four for the Android APK: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Nothing is built or published if the tests fail.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg (some tests make small test videos)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      # Some tests load the built main page (dist/), so build it first.
      - run: npm run build
      - run: npm test
      - name: Lint (errors fail, warnings do not)
        run: npm run lint

  # One DRAFT release first (with the notes from the tag message), so the builds below all add to the same one.
  # The last job publishes it once every build passed its checks.
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.txt
          # drafts don't show up in `gh release view <tag>`, so look through the list (a re-run must not make a second one)
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name' | grep -qx "${GITHUB_REF_NAME}"; then
            gh release create "${GITHUB_REF_NAME}" --draft --title "CiRoom ${GITHUB_REF_NAME}" --notes-file notes.txt
          fi

  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pipewire gstreamer1.0-pulseaudio
      - run: npm ci
      - name: Bundle Node (runs CiRoom's server)
        run: |
          mkdir -p src-tauri/binaries
          cp "$(command -v node)" src-tauri/binaries/node-x86_64-unknown-linux-gnu
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GSTREAMER_INCLUDE_BAD_PLUGINS: "1" # h264parse etc. live in plugins-bad
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CiRoom ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
      # The AppImage is only in the draft so far. Without the GStreamer plugins video freezes (0.1.5): fail here, so it is never published.
      - name: Check the AppImage carries the media plugins
        run: bash scripts/check-appimage.sh src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    needs: [release, linux] # after Linux, so the two never update latest.json at the same moment
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Informational for now (never run on Windows before): flip continue-on-error off once it is green there.
      - name: Tests (Windows)
        continue-on-error: true
        timeout-minutes: 15 # one test hung for 1.5 h on the first Windows run (v0.2.2); never block the build on it
        run: npm test
      - name: Bundle Node (runs CiRoom's server)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item (Get-Command node).Source src-tauri/binaries/node-x86_64-pc-windows-msvc.exe
      - name: Bundle mpv and ffmpeg (Windows has neither)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $bin = "src-tauri/windows-bin"
          New-Item -ItemType Directory -Force $bin, dl | Out-Null
          # PINNED downloads: fixed release + SHA-256, so a changed or compromised upstream build can't ship unnoticed.
          # To bump: pick a new release (BtbN: a dated "autobuild-..." tag, asset ffmpeg-n8.1.*-win64-gpl-shared-8.1.zip, hash in the tag's
          # checksums.sha256; shinchiro: a release tag, asset mpv-x86_64-<date>-git-<hash>.7z, not "v3", hash shown on the asset's release page).
          # Change URL + hash together, then run a test build and check ffmpeg (with Chromaprint) and mpv in the installer.
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-18-12-39/ffmpeg-n8.1.3-36-ge22a4510c9-win64-gpl-shared-8.1.zip"
          $ffmpegSha = "a8339655aaaf61739e013c65f04d26c716a1af7e18fd66a8ea4198f07ee994c0"
          $mpvUrl = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-x86_64-20261111-git-bcde6b93cc.7z"
          $mpvSha = "f259b5fd4b5c395617c948a4fadcdf55bba1c5282fb7c13e88626b3f71072baf"
          function Get-Pinned($url, $sha, $out) {
            Invoke-WebRequest $url -OutFile $out
            $got = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLower()
            if ($got -ne $sha) { throw "SHA-256 mismatch for $url`nexpected $sha`ngot      $got" }
          }
          # ffmpeg + ffprobe: BtbN GPL shared build of the 8.1 line (includes Chromaprint, used for skip intro)
          Get-Pinned $ffmpegUrl $ffmpegSha dl/ffmpeg.zip
          Expand-Archive dl/ffmpeg.zip dl/ffmpeg
          Get-ChildItem dl/ffmpeg -Recurse -Include ffmpeg.exe, ffprobe.exe, *.dll | Copy-Item -Destination $bin
          # mpv: shinchiro build (x86_64, not the "v3" build, which needs a newer CPU)
          Get-Pinned $mpvUrl $mpvSha dl/mpv.7z
          7z x dl/mpv.7z -odl/mpv -y | Out-Null
          Get-ChildItem dl/mpv -Recurse -Include mpv.exe, *.dll | Copy-Item -Destination $bin
          # Checks: Chromaprint present, both programs run
          $mux = & "$bin/ffmpeg.exe" -hide_banner -muxers 2>&1 | Out-String
          if ($mux -notmatch "chromaprint") { throw "ffmpeg has no Chromaprint" }
          & "$bin/ffprobe.exe" -version | Select-Object -First 1
          & "$bin/mpv.exe" --version | Select-Object -First 1
          Get-ChildItem $bin | Format-Table Name, Length
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CiRoom ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true

  # The Android app (an APK for the user's phone), signed with the Android key. It only adds one file to the draft release:
  # never latest.json (that file is the desktop updater's). A missing secret fails the job, so an unsigned APK is never published.
  # The signing secrets are given only to the two steps that use them (not to the third-party actions). The log shows only the key's SHA-256 (the DN holds a name).
  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: The signing secrets are all there
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::The repository secret $v is missing (Settings, Secrets and variables, Actions). Not building an unsigned APK."; exit 1; fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Android SDK (the exact versions the project builds with)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ciroom-android.jks"
          export CIROOM_ANDROID_KEYSTORE="$RUNNER_TEMP/ciroom-android.jks"
          export CIROOM_ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export CIROOM_ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS"
          export CIROOM_ANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          npx tauri android build --apk --target aarch64
          version="${GITHUB_REF_NAME#v}"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "CiRoom_${version}_android-arm64.apk"
      - name: The APK is signed
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs CiRoom_*_android-arm64.apk | grep "Signer #1 certificate SHA-256"
      # gh can't find a draft release by its tag, so look the id up in the list, then talk to the API directly.
      - name: Add the APK to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk=$(ls CiRoom_*_android-arm64.apk)
          id=$(gh api "repos/${GH_REPO}/releases" --paginate --jq ".[] | select(.tag_name==\"${GITHUB_REF_NAME}\") | .id" | head -1)
          if [ -z "$id" ]; then echo "::error::No release found for ${GITHUB_REF_NAME}"; exit 1; fi
          # a re-run replaces the file instead of failing on the same name
          for old in $(gh api "repos/${GH_REPO}/releases/${id}/assets" --paginate --jq ".[] | select(.name==\"${apk}\") | .id"); do
            gh api -X DELETE "repos/${GH_REPO}/releases/assets/${old}"
          done
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${apk}" "https://uploads.github.com/repos/${GH_REPO}/releases/${id}/assets?name=${apk}" >/dev/null
      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/ciroom-android.jks"

  # Only reached when the tests, the Linux package check and both builds passed.
  publish:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/${GH_REPO}/releases" --paginate --jq ".[] | select(.tag_name==\"${GITHUB_REF_NAME}\") | .id" | head -1)
          gh api -X PATCH "repos/${GH_REPO}/releases/${id}" -F draft=false >/dev/null
