[package]
name = "ciroom"
version = "0.1.0"
description = "Local-first personal media center"
edition = "2021"

[lib]
# `_lib` suffix avoids a name clash with the binary on some platforms.
name = "ciroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true

# The system disk is small (~5 GB free): no debug symbols keeps target/ under ~1 GB.
[profile.dev]
debug = false

[profile.dev.package."*"]
debug = false
