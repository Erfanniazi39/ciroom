# CiRoom keyboard shortcuts inside the player (same as the in-app hints).
SPACE        cycle pause
MBTN_LEFT_DBL cycle fullscreen
f            cycle fullscreen
ESC          set fullscreen no
LEFT         seek -10
RIGHT        seek 10
Shift+LEFT   seek -60
Shift+RIGHT  seek 60
UP           add volume 5
DOWN         add volume -5
WHEEL_UP     add volume 5
WHEEL_DOWN   add volume -5
m            cycle mute
s            cycle sub
a            cycle audio
z            add sub-delay -0.1      # subtitles earlier
x            add sub-delay +0.1      # subtitles later
Z            set sub-delay 0
[            add speed -0.25
]            add speed 0.25
BS           set speed 1.0
n            script-message marquee-next   # next episode (handled by CiRoom)
TAB          script-binding marquee_osc/toggle
q            quit
