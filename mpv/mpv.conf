# CiRoom's own mpv profile. Passed with --config-dir, so the user's ~/.config/mpv is not used
# and CiRoom always looks and behaves the same. Bundled with the app in Stage 3.

# Playback
hwdec=auto-safe
keep-open=no
force-window=immediate
cursor-autohide=1200
save-position-on-quit=no        # CiRoom stores progress itself

# Read ahead so the seek bar can show a real buffered range
cache=yes
demuxer-readahead-secs=60
demuxer-max-bytes=400MiB

# On-screen text (OSD: seek messages, volume, etc.)
osd-font='Noto Sans'
osd-font-size=28
osd-bold=yes
osd-color='#F4F4F6'
osd-border-color='#B0000000'
osd-border-size=1.6
osd-shadow-offset=0
osd-margin-x=40
osd-margin-y=36
osd-duration=1200
osd-on-seek=no                   # the CiRoom controller shows seeking itself
osd-playing-msg='${media-title}'
osd-playing-msg-duration=2500

# Subtitles: clean, readable, and lifted above the control bar
sub-font='Noto Sans'
sub-font-size=44
sub-bold=yes
sub-color='#FFFFFF'
sub-border-color='#E6000000'
sub-border-size=2.6
sub-shadow-color='#66000000'
sub-shadow-offset=1.2
sub-spacing=0.3
sub-margin-y=48
sub-auto=no                      # CiRoom passes subtitle files explicitly
sub-ass-override=no              # keep styled .ass subtitles as their authors made them

# Controls: CiRoom's own controller (scripts/marquee-osc.lua) replaces mpv's built-in one
osc=no
osd-bar=no

# Window
title='${media-title} — CiRoom'
